<div class="dashboard">
  <div class="page-header">
    <h1 class="page-title">Sale Report Analytics</h1>
    <p class="page-subtitle">Track product sales performance across all retail locations</p>
  </div>

  <div class="stats-grid" *ngIf="!loading() && summary()">
    <app-stat-card
      label="Total Revenue"
      [value]="summary().totalRevenue | currencyFormat"
      [trend]="trends.revenue.value"
      [trendDirection]="trends.revenue.direction"
      [loading]="loading()">
    </app-stat-card>

    <app-stat-card
      label="Units Sold"
      [value]="summary().totalQuantity | numberFormat"
      [trend]="trends.quantity.value"
      [trendDirection]="trends.quantity.direction"
      [loading]="loading()">
    </app-stat-card>

    <app-stat-card
      label="Avg Order Value"
      [value]="summary().averageOrderValue | currencyFormat"
      [trend]="trends.avgOrder.value"
      [trendDirection]="trends.avgOrder.direction"
      [loading]="loading()">
    </app-stat-card>

    <app-stat-card
      label="Active Products"
      [value]="summary().uniqueProducts"
      [trend]="trends.products.value"
      [trendDirection]="trends.products.direction"
      [loading]="loading()">
    </app-stat-card>
  </div>

  <div *ngIf="loading()" class="loading-container">
    <p>Loading data, please wait...</p>
  </div>

  <app-filters *ngIf="!loading() && summary()"></app-filters>

  <div class="charts-grid" *ngIf="!loading()">
    <app-chart
      title="Revenue by Brand"
      type="bar"
      [data]="revenueByBrand()"
      [loading]="loading()">
    </app-chart>

    <app-chart
      title="Revenue by Category"
      type="doughnut"
      [data]="revenueByCategory()"
      [loading]="loading()">
    </app-chart>

    <app-chart
      title="Daily Revenue Trend"
      type="line"
      [data]="dailyRevenue()"
      [loading]="loading()">
    </app-chart>

    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">Top Products by Revenue</h3>
        <div class="chart-actions">
          <button class="chart-action-btn" title="Export">
          </button>
        </div>
      </div>

      <div class="top-products">
        <div class="top-products-loading" *ngIf="loading()">
          <div class="loading-spinner"></div>
          <p>Loading products...</p>
        </div>

        <div class="top-products-list" *ngIf="!loading() && topProducts().length > 0">
          <div class="product-item" *ngFor="let product of topProducts(); let i = index">
            <div class="product-rank">{{ i + 1 }}</div>
            <div class="product-details">
              <div class="product-name">{{ product.name }}</div>
              <div class="product-revenue">{{ product.revenue }}</div>
            </div>
            <div class="product-bar">
              <div
                class="product-bar-fill"
                [style.width.%]="(product.revenue / topProducts()[0].revenue) * 100">
              </div>
            </div>
          </div>
        </div>

        <div class="empty-state" *ngIf="!loading() && topProducts().length === 0">
          <p>No products found matching the current filters</p>
        </div>
      </div>
    </div>
  </div>
</div>
